
#==============================================================================
# GLOBAL & DEFAULTS (The Engine)
#==============================================================================
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    user haproxy
    group haproxy
    daemon
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    
    # Timeouts
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    # Critical for your Chat/WebSockets:
    timeout tunnel  1h 

#==============================================================================
# FRONTEND: The Entry Point
#==============================================================================
frontend main_gateway
    bind *:80
    bind *:443 ssl crt /etc/ssl/haproxy_certs/
    
    # 1. Force HTTPS
    redirect scheme https code 301 if !{ ssl_fc }

    # 2. Proxy Headers (Essential for Django SECURE_PROXY_SSL_HEADER)
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # 3. ACLs for APP 1: Fitness (api.bodyremix.ir)
    acl host_fitness       hdr(host) -i api.bodyremix.ir
    acl host_fitness_minio hdr(host) -i storage-fitness.bodyremix.ir

    # 4. ACLs for APP 2: Future Store
    acl host_store         hdr(host) -i store.bodyremix.ir
    acl host_store_minio   hdr(host) -i storage-store.bodyremix.ir

    # 5. Routing Logic
    use_backend fitness_django_cluster if host_fitness
    use_backend fitness_minio_cluster  if host_fitness_minio

    use_backend store_django_cluster   if host_store
    use_backend store_minio_cluster    if host_store_minio

#==============================================================================
# BACKENDS: The Destinations
#==============================================================================

# --- FITNESS APP ---
backend fitness_django_cluster
    balance roundrobin
    # WebSocket support: check for "Upgrade" header automatically handled by 'mode http' 
    # but 'timeout tunnel' in defaults ensures the connection stays open for chat.
    server fitness_app_1 127.0.0.1:8000 check

backend fitness_minio_cluster
    balance roundrobin
    # Minio needs large buffer for file uploads
    option httpchk GET /minio/health/live
    server fitness_s3_1 127.0.0.1:9000 check

# --- STORE APP (Future) ---
backend store_django_cluster
    balance roundrobin
    server store_app_1 127.0.0.1:8001 check

backend store_minio_cluster
    balance roundrobin
    server store_s3_1 127.0.0.1:9001 check

#==============================================================================
# MONITORING
#==============================================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 15s
    stats auth admin:mm958










    