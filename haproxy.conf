global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog

    timeout connect 5s
    timeout client  50s
    timeout server  50s

    # WebSocket / Channels
    timeout tunnel 1h


# =========================================================
# HTTP :80
# =========================================================
frontend http_in
    bind *:80

    # ACME challenge path is intentionally not redirected.
    # Certbot standalone temporarily uses port 80 when HAProxy
    # is stopped during certificate issuance/renewal.
    redirect scheme https code 301 if !{ path_beg /.well-known/acme-challenge/ }


# =========================================================
# HTTPS :443
# =========================================================
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/bodyremix.pem

    mode http
    option forwardfor

    # Tell Django / backend that the original request was HTTPS
    http-request set-header X-Forwarded-Proto https

    # -----------------------------------------------------
    # Host ACLs
    # -----------------------------------------------------
    acl is_api hdr(host) -i api.bodyremix.ir
    acl is_minio hdr(host) -i minio.bodyremix.ir
    acl is_web hdr(host) -i spacedigital.top app.spacedigital.top app.bodyremix.ir

    # -----------------------------------------------------
    # Routing
    # -----------------------------------------------------
    use_backend minio_api_back if is_minio
    use_backend django_back if is_api
    use_backend web_back if is_web

    # Fallback
    default_backend django_back


# =========================================================
# Django
# =========================================================
backend django_back
    mode http
    balance roundrobin

    option forwardfor

    server django1 127.0.0.1:8000 check


# =========================================================
# Web frontend
# =========================================================
backend web_back
    mode http
    balance roundrobin

    option forwardfor

    server web1 127.0.0.1:8081 check


# =========================================================
# MinIO S3 API
# Public endpoint:
# https://minio.bodyremix.ir
#
# Internal VPS endpoint:
# 127.0.0.1:9000
# =========================================================
backend minio_api_back
    mode http

    option forwardfor

    server minio_api 127.0.0.1:9000 check


# =========================================================
# MinIO Console
#
# External:
# https://YOUR_SERVER_IP:9001
#
# Internal:
# 127.0.0.1:9090
# =========================================================
frontend minio_console_in
    bind *:9001 ssl crt /etc/haproxy/certs/bodyremix.pem

    mode http
    option forwardfor

    http-request set-header X-Forwarded-Proto https

    default_backend minio_console_back


backend minio_console_back
    mode http

    option forwardfor

    server minio_ui 127.0.0.1:9090 check