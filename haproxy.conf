global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog

    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout tunnel 1h


# ============================================================
# HTTP :80
# ============================================================
#
# All HTTP traffic is redirected to HTTPS.
#
# Certbot SSL renewal uses standalone mode, so HAProxy is
# stopped temporarily during renewal.
#
# ============================================================

frontend http_in
    bind *:80

    redirect scheme https code 301


# ============================================================
# HTTPS :443
# ============================================================
#
# HAProxy selects the correct certificate based on SNI.
#
# Certificates:
#
#   /etc/haproxy/certs/spacedigital.pem
#       api.spacedigital.top
#       minio.spacedigital.top
#       spacedigital.top
#       app.spacedigital.top
#
#   /etc/haproxy/certs/bodyremix.pem
#       bodyremix.ir
#       www.bodyremix.ir
#
# ============================================================

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/

    mode http
    option forwardfor

    http-request set-header X-Forwarded-Proto https


    # --------------------------------------------------------
    # SpaceDigital VPN API
    # --------------------------------------------------------

    acl spacedigital_vpn_api hdr(host) -i api.spacedigital.top


    # --------------------------------------------------------
    # SpaceDigital VPN MinIO
    # --------------------------------------------------------

    acl spacedigital_vpn_minio hdr(host) -i minio.spacedigital.top


    # --------------------------------------------------------
    # SpaceDigital Web
    # --------------------------------------------------------

    acl spacedigital_web hdr(host) -i spacedigital.top app.spacedigital.top


    # --------------------------------------------------------
    # BodyRemix Flutter
    # --------------------------------------------------------

    acl bodyremix_flutter hdr(host) -i bodyremix.ir www.bodyremix.ir


    # --------------------------------------------------------
    # Routing
    # --------------------------------------------------------

    use_backend spacedigital_vpn_api_back if spacedigital_vpn_api

    use_backend spacedigital_vpn_minio_back if spacedigital_vpn_minio

    use_backend spacedigital_web_back if spacedigital_web

    use_backend bodyremix_flutter_back if bodyremix_flutter


    # --------------------------------------------------------
    # Unknown Host
    # --------------------------------------------------------
    #
    # Do NOT silently send unknown domains to Django.
    # Return HTTP 404 instead.
    #
    # --------------------------------------------------------

    http-request return status 404 content-type text/plain lf-string "Unknown host"


# ============================================================
# SpaceDigital VPN - Django API
# ============================================================

backend spacedigital_vpn_api_back
    mode http
    balance roundrobin
    option forwardfor

    server spacedigital_vpn_django 127.0.0.1:8000 check


# ============================================================
# SpaceDigital VPN - MinIO S3 API
# ============================================================

backend spacedigital_vpn_minio_back
    mode http
    option forwardfor

    server spacedigital_vpn_minio 127.0.0.1:9000 check


# ============================================================
# SpaceDigital Web
# ============================================================

backend spacedigital_web_back
    mode http
    balance roundrobin
    option forwardfor

    server spacedigital_web 127.0.0.1:8081 check


# ============================================================
# BodyRemix Flutter
# ============================================================

backend bodyremix_flutter_back
    mode http
    balance roundrobin
    option forwardfor

    server bodyremix_flutter 127.0.0.1:8082 check


# ============================================================
# SpaceDigital VPN - MinIO Console
# ============================================================
#
# S3 / public media:
#
#   https://minio.spacedigital.top
#
# MinIO Console:
#
#   https://SERVER-IP:9001
#
# Port 9001 is intentionally kept private to the server and
# exposed through HAProxy on the same port.
#
# ============================================================

frontend spacedigital_vpn_minio_console_in
    bind *:9001 ssl crt /etc/haproxy/certs/

    mode http
    option forwardfor

    http-request set-header X-Forwarded-Proto https

    default_backend spacedigital_vpn_minio_console_back


backend spacedigital_vpn_minio_console_back
    mode http
    option forwardfor

    server spacedigital_vpn_minio_console 127.0.0.1:9090 check