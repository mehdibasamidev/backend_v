services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  spacedigital_vpn_db:
    image: postgres:15
    container_name: spacedigital_vpn_db
    restart: always
    env_file:
      - .env
    volumes:
      - spacedigital_vpn_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # Private
    networks:
      - spacedigital_vpn_net

  # ============================================================
  # Redis
  # ============================================================
  spacedigital_vpn_redis:
    image: redis:7-alpine
    container_name: spacedigital_vpn_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379" # Private
    networks:
      - spacedigital_vpn_net

  # ============================================================
  # MinIO
  # ============================================================
  spacedigital_vpn_minio:
    # MINIO_IMAGE lets a server pin the exact build (e.g. minio/minio@sha256:...)
    # when migrating data from another server; see docs/MIGRATION_FA.md.
    image: ${MINIO_IMAGE:-minio/minio}
    container_name: spacedigital_vpn_minio
    restart: always
    env_file:
      - .env
    command:
      - server
      - /data
      - --console-address
      - ":9090"
    volumes:
      - spacedigital_vpn_minio_data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API - Private to HAProxy
      - "127.0.0.1:9090:9090" # Console - Private to HAProxy
    networks:
      spacedigital_vpn_net:
        aliases:
          - vpnminio

  # ============================================================
  # Django / API
  # ============================================================
  spacedigital_vpn_django:
    build: .
    container_name: spacedigital_vpn_django
    restart: always
    env_file:
      - .env
    command:
      - sh
      - /app/app.sh
    # volumes:
    #   - .:/app
    depends_on:
      - spacedigital_vpn_db
      - spacedigital_vpn_redis
      - spacedigital_vpn_minio
    ports:
      - "127.0.0.1:8000:8000" # Private to HAProxy
    networks:
      - spacedigital_vpn_net

  # ============================================================
  # Telegram Bot - Long Polling Worker
  # ============================================================
  #
  # This is a separate long-running process.
  #
  # It does NOT expose any port because Telegram does not need
  # to connect to this container.
  #
  # The worker makes outbound requests:
  #
  #     Django container
  #           |
  #           | TELEGRAM_PROXY_URL
  #           v
  #     Telegram Bot API
  #
  # This avoids the inbound Telegram -> HAProxy -> Django
  # webhook path that is currently unreliable on this server.
  #
  spacedigital_vpn_telegram_bot:
    build: .
    container_name: spacedigital_vpn_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    command:
      - python
      - manage.py
      - telegram_polling
    depends_on:
      - spacedigital_vpn_db
      - spacedigital_vpn_redis
      - spacedigital_vpn_minio
      - spacedigital_vpn_django
    networks:
      - spacedigital_vpn_net

# ================================================================
# Volumes
# ================================================================

volumes:
  spacedigital_vpn_postgres_data:
    name: spacedigital_vpn_postgres_data
    # external: true

  spacedigital_vpn_minio_data:
    name: spacedigital_vpn_minio_data
    # external: true

# ================================================================
# Network
# ================================================================

networks:
  spacedigital_vpn_net:
    name: spacedigital_vpn_net
    driver: bridge
